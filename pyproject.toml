[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canaryew"
version = "0.1.0"
description = "Early-warning monitor for unauthorized Bitcoin spends, with no xpub at rest."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "mypy"]

[project.scripts]
canaryew = "canaryew.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["canaryew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
