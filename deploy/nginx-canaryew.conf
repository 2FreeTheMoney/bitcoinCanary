# Optional LAN exposure of the status surface, mounted at a subpath.
# Include from the main server block.
#
# Exposes ONLY the keyless read-only status app. The monitor itself has no
# network listener at all -- its control socket is a unix socket.

location /canaryew/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
